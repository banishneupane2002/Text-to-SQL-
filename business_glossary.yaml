# =====================================================================
# ApexBank Text-to-SQL — Business Glossary & Domain Semantics
# AdventureWorks2022 Text-to-SQL — Business Glossary & Domain Semantics
# =====================================================================
# This file is 100% decoupled from Python code.
# When connecting to a new database (e.g. Healthcare, Retail, or another Bank),
# simply update or clear this file.
# If this file is empty or missing, the system runs dynamically on pure column names!
# Defines domain groupings, table synonyms, and column semantic mappings.

# 1. Custom Domain Categorizations (Optional)
# If not specified, domains are generated dynamically from table names.
# 1. Custom Domain Categorizations
domains:
  "Accounts & Transactions":
    description: "Account balances, deposits, withdrawals, transfers, and bank statements."
    tables: ["account", "trans", "order"]
  "Loans & Credit":
    description: "Loan requests, payments, amounts, duration, and debt status."
    tables: ["loan"]
  "Cards & Services":
    description: "Credit cards, debit cards, card types (classic, gold, junior)."
    tables: ["card", "disp"]
  "Clients & Demographics":
    description: "Client personal details, gender, age, district, and regional population."
    tables: ["client", "district"]
  "Human Resources & Payroll":
    description: "Employees, job titles, departments, shifts, pay rates, salaries, compensation history, and hiring."
    tables:
      - "HumanResources.Employee"
      - "HumanResources.EmployeePayHistory"
      - "HumanResources.Department"
      - "HumanResources.EmployeeDepartmentHistory"
      - "HumanResources.Shift"
      - "HumanResources.JobCandidate"

  "Sales & Customers":
    description: "Sales orders, customers, sales reps, revenue, quotas, shopping carts, credit cards, and sales territories."
    tables:
      - "Sales.SalesOrderHeader"
      - "Sales.SalesOrderDetail"
      - "Sales.Customer"
      - "Sales.SalesPerson"
      - "Sales.SalesTerritory"
      - "Sales.Store"
      - "Sales.CreditCard"

  "Products & Inventory":
    description: "Products, categories, subcategories, inventory quantities, list prices, costs, and work orders."
    tables:
      - "Production.Product"
      - "Production.ProductInventory"
      - "Production.ProductCategory"
      - "Production.ProductSubcategory"
      - "Production.ProductCostHistory"
      - "Production.ProductListPriceHistory"
      - "Production.WorkOrder"

  "Purchasing & Vendors":
    description: "Vendors, suppliers, purchase orders, shipments, and vendor product pricing."
    tables:
      - "Purchasing.Vendor"
      - "Purchasing.PurchaseOrderHeader"
      - "Purchasing.PurchaseOrderDetail"
      - "Purchasing.ProductVendor"
      - "Purchasing.ShipMethod"

  "People & Contacts":
    description: "Individuals, customer contacts, addresses, phone numbers, state/provinces, and email addresses."
    tables:
      - "Person.Person"
      - "Person.EmailAddress"
      - "Person.PersonPhone"
      - "Person.Address"
      - "Person.StateProvince"
      - "Person.CountryRegion"

# 2. Cryptic Value Mappings (Translates business slang/codes to DB values)
# Essential for databases with coded flags (like 'A', 'B', 'PRIJEM', 'SIPO')
codes:
  "loan.status":
    "A": "Contract finished, loan paid in full (Good standing)"
    "B": "Contract finished, loan not paid (Defaulted / Bad debt)"
    "C": "Running contract, payments OK (Current)"
    "D": "Running contract, client in debt (Delinquent)"
  "trans.type":
    "PRIJEM": "Credit / Deposit / Money in"
    "VYDAJ": "Debit / Withdrawal / Money out"
  "trans.k_symbol":
    "SIPO": "Household / utility bill payment"
    "UROK": "Interest credited by bank"
    "POJISTNE": "Insurance policy payment"
    "DUCHOD": "Old-age pension payment"
    "UVER": "Loan payment"
  "card.type":
    "junior": "Junior debit card"
    "classic": "Classic credit card"
    "gold": "Gold premium credit card"

